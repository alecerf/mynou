name: WireGuard interoperability
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wireguard-interop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  independent-peer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Build the checksum-verified independent peer and Rust test image
        run: |
          docker build -t mynou-wireguard-peer -f .github/scripts/Dockerfile.wireguard-peer .github/scripts
          docker build -t mynou-local-rust -f .github/scripts/Dockerfile.rust .github/scripts
      - name: Exercise every required interoperability scenario
        run: python3 .github/scripts/wireguard_interop.py --target-volume mynou-rust-220
