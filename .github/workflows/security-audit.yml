name: Security audit
on:
  pull_request:
  push:
    branches: [trunk]
  workflow_dispatch:
    inputs:
      full_log_audit:
        description: Rebuild completed-log coverage with an actual full scan
        type: boolean
        default: false
  schedule:
    # Hourly incremental log audit; it also keeps the coverage receipt fresh.
    - cron: '41 * * * *'
permissions:
  contents: read
  actions: read
concurrency:
  # Only a newer pull request head supersedes an audit; default runs never cancel.
  group: mynou-security-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  source-history:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Audit all reachable Git objects without exposing findings
        run: python3 engineering/secret_audit.py history --output "$RUNNER_TEMP/source-audit.json"
      - name: Preserve redacted source coverage
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: security-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-audit.json
          retention-days: 14
          if-no-files-found: error
  actions-logs:
    # Log coverage is repository-wide history, not a property of one pull request:
    # it runs on the default branch, hourly and on dispatch, never as a PR gate.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Serialized audits chain their receipts; a queued audit is never cancelled.
    concurrency:
      group: mynou-actions-log-audit
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Audit completed Actions attempt logs without publishing raw logs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MYNOU_FULL_LOG_AUDIT: ${{ github.event_name == 'workflow_dispatch' && inputs.full_log_audit }}
        run: python3 engineering/secret_audit.py logs --output "$RUNNER_TEMP/actions-audit.json"
      - name: Preserve redacted log coverage
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: security-actions-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/actions-audit.json
          retention-days: 14
          if-no-files-found: error
