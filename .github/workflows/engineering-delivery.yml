name: Serialized engineering delivery
on:
  workflow_run:
    workflows: [Mynou CI, Engineering checks]
    types: [completed]
  issue_comment:
    types: [created]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
    - cron: '47 3 * * *'
permissions:
  contents: write
  pull-requests: write
  issues: write
  # GITHUB_TOKEN merge pushes do not trigger CI; native dispatch needs write.
  actions: write
jobs:
  delivery:
    # Wake only when delivery can change: a passed PR gate run, a default-branch
    # CI result, a trusted handoff, the schedule or a dispatch. Other completions
    # (PR CI that the later gate waits for, failures, cancellations) skip here.
    if: >-
      (github.event_name == 'workflow_run' &&
       ((github.event.workflow_run.name == 'Engineering checks' &&
         github.event.workflow_run.conclusion == 'success' &&
         (github.event.workflow_run.event == 'pull_request' ||
          github.event.workflow_run.event == 'pull_request_review')) ||
        (github.event.workflow_run.name == 'Mynou CI' &&
         github.event.workflow_run.head_branch == 'trunk' &&
         github.event.workflow_run.event != 'pull_request'))) ||
      (github.event_name == 'issue_comment' &&
       contains(github.event.comment.body, '<!-- mynou-transition:v1 -->') &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # Job-level, so skipped wakes never displace a pending delivery or command.
    concurrency:
      group: mynou-global-mechanical-delivery
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # A privileged workflow never checks out or executes proposed PR code.
      - uses: actions/checkout@v7.0.1
        with:
          ref: trunk
          persist-credentials: false
      - name: Recover first and deliver only through exact objective gates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 engineering/control.py deliver
      - name: Inspect incremental branch health daily or on explicit dispatch
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'schedule' && github.event.schedule == '47 3 * * *')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 engineering/control.py branch-sweep
