name: Mynou CI
on:
  push:
    # Nothing runs for a commit on trunk: protection requires an up-to-date
    # branch and rebase merging, so trunk holds the tree its pull request
    # validated. Pushing a version tag builds that commit and publishes it: a
    # release PR only raises the version over a tree trunk validated, so a
    # release runs no tests.
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mynou-${{ github.workflow }}-${{ github.ref }}
  # A newer PR head supersedes its older validation. Tag runs, which publish a
  # release, are never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  changes:
    uses: ./.github/workflows/changes.yml
  decide:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.build == 'true') }}
    # Selected pull requests, manual dispatches and tags run this chain; only a
    # tag that names the Cargo.toml version of a commit already on trunk, and
    # that raised the version over its parent, may then publish. Nothing else
    # depends on this job: package fails on a pull request when its version is
    # missing, and for a tag a failed decision only keeps release from running.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.decision.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The parent of a tagged commit carries the previous version and the notes.
          fetch-depth: 2
          persist-credentials: false
      - name: Read the package version
        id: version
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'VERSION'
          import tomllib
          with open("Cargo.toml", "rb") as stream:
              print("version=" + tomllib.load(stream)["package"]["version"])
          VERSION
      - name: Decide whether this run validates and publishes a release
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != push ] || [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The binary reports the Cargo.toml version, so the tag must name it.
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the Cargo.toml version v$VERSION." >&2
            exit 1
          fi
          # Only a commit that reached trunk through a validated pull request may
          # be released: it must be trunk itself or one of its ancestors.
          relation=$(gh api "repos/$GITHUB_REPOSITORY/compare/trunk...$GITHUB_SHA" --jq .status)
          case "$relation" in
            identical|behind) ;;
            *) echo "Commit $GITHUB_SHA is not on trunk (compare status: $relation)." >&2; exit 1 ;;
          esac
          # The tag sits on the release commit: it raised the version over its
          # parent and over the latest release, and the parent's unreleased notes
          # become the release changelog.
          # Only "no release yet" (HTTP 404) means there is no latest to exceed.
          if ! latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2> "$RUNNER_TEMP/latest.txt"); then
            latest=""
            grep -q 'HTTP 404' "$RUNNER_TEMP/latest.txt" || { echo "Cannot read the latest release." >&2; exit 1; }
          fi
          python3 - "$(git show "$GITHUB_SHA^:Cargo.toml")" "$VERSION" "$latest" <<'RAISED'
          import sys, tomllib
          before = tomllib.loads(sys.argv[1])["package"]["version"]
          parse = lambda text: tuple(int(part) for part in text.lstrip("v").split("."))
          if parse(before) >= parse(sys.argv[2]):
              sys.exit("The tagged commit does not raise the version over its parent.")
          if sys.argv[3] and parse(sys.argv[3]) >= parse(sys.argv[2]):
              sys.exit("The version does not exceed the latest release " + sys.argv[3] + ".")
          RAISED
          git show "$GITHUB_SHA^:UNRELEASED.md" | env -u GH_TOKEN python3 .github/scripts/releases.py notes --tag "$GITHUB_REF_NAME" > /dev/null
          echo "v$VERSION is a trunk commit; this run publishes it once every check passes." >> "$GITHUB_STEP_SUMMARY"
          echo "publish=true" >> "$GITHUB_OUTPUT"
  validate:
    needs: changes
    # A failed selector must fail required checks, never silently skip them.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.tests == 'true') }}
    # Mynou ships for macOS Apple Silicon only, so its checks run there too.
    runs-on: macos-26
    # A generous whole-job bound for a hung step; parallel_tests.py still
    # bounds each test group at 480 seconds. Green runs take about five minutes;
    # a tight deadline kept cancelling them as the suite grew (#237).
    timeout-minutes: 30
    env:
      # test-cache.yml warms the cache with the same settings: Cargo rebuilds
      # everything when a profile setting differs.
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Require a successful change selection
        env:
          SELECTION_RESULT: ${{ needs.changes.result }}
        run: test "$SELECTION_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.99.1
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.1
      - name: Restore incremental build state from trunk
        # Only test-cache.yml, on trunk, saves this cache. Cargo still checks
        # every input and rebuilds what changed: the cache only makes the
        # rebuild incremental, it never stands in for compilation.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/debug
          key: rust-1.99.1-${{ runner.arch }}-debug0-v4-${{ github.sha }}
          restore-keys: rust-1.99.1-${{ runner.arch }}-debug0-v4-
      - name: Verify the dependency graph
        id: metadata
        run: |
          cargo metadata --offline --locked --format-version 1 > "$RUNNER_TEMP/metadata.json"
          python3 - "$RUNNER_TEMP/metadata.json" >> "$GITHUB_OUTPUT" <<'GRAPH'
          import json, sys
          with open(sys.argv[1]) as stream:
              packages = json.load(stream)["packages"]
          assert len(packages) == 1 and packages[0]["name"] == "mynou"
          assert packages[0]["dependencies"] == []
          print("version=" + packages[0]["version"])
          GRAPH
          cargo tree --all-features --target all --edges all --offline --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check the torrent network inventory
        run: python3 -B .github/scripts/network_inventory.py
      - name: Run Clippy
        run: cargo clippy --all-targets --offline --locked -- -D warnings
      - name: Generate independent crypto reference fixtures
        run: python3 .github/scripts/crypto_fixtures.py "$RUNNER_TEMP/mynou-crypto-vectors.json"
      - name: Compile all test harnesses
        run: cargo test --all-targets --no-run --offline --locked --message-format=json-render-diagnostics > target/debug/mynou-ci-test-build.jsonl
      - name: Put test storage on a RAM disk
        run: |
          # On macOS, sync_all is F_FULLFSYNC (a whole-drive cache flush), and
          # the growing-inventory tests issue tens of thousands of them (#238).
          # A RAM disk keeps every durability call while making it cheap. The
          # suite peaked near 170 MiB of temporary data; allocate 2 GiB. Every
          # later step, observers included, uses it.
          ram_disk=$(hdiutil attach -nomount ram://4194304 | awk 'NR == 1 { print $1 }')
          diskutil erasevolume APFS mynou-tests "$ram_disk" > /dev/null
          tmp="$(cd /Volumes/mynou-tests && pwd -P)"
          test "$tmp" = /Volumes/mynou-tests
          echo "TMPDIR=$tmp" >> "$GITHUB_ENV"
      - name: Observe attempted host I/O in native WireGuard fixtures
        run: python3 .github/scripts/host_io_observer.py --build-json target/debug/mynou-ci-test-build.jsonl --output "$RUNNER_TEMP/mynou-test-results/host-io"
      - name: Observe real host route loss on the disposable macOS runner
        run: python3 .github/scripts/host_route_observer.py --build-json target/debug/mynou-ci-test-build.jsonl --library "$RUNNER_TEMP/mynou-test-results/host-io/host_io_observer.dylib" --output "$RUNNER_TEMP/mynou-test-results/host-routes"
      - name: Run all Rust test harnesses in parallel
        env:
          MYNOU_CRYPTO_FIXTURES: ${{ runner.temp }}/mynou-crypto-vectors.json
        # Growing-inventory regressions measured 358 seconds in the library
        # harness: every group keeps a finite eight-minute budget. Most tests
        # wait on timers and sockets rather than the CPU, so the scheduler runs
        # more groups than the runner has cores.
        run: python3 .github/scripts/parallel_tests.py target/debug/mynou-ci-test-build.jsonl --metadata "$RUNNER_TEMP/metadata.json" --output "$RUNNER_TEMP/mynou-test-results/rust" --timeout 480 --workers 5
      - name: Preserve test timings and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mynou-tests-${{ github.sha }}
          path: ${{ runner.temp }}/mynou-test-results
          if-no-files-found: ignore
          retention-days: 7
  organization:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.tooling == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require a successful change selection
        env:
          SELECTION_RESULT: ${{ needs.changes.result }}
        run: test "$SELECTION_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exercise CI, release and interoperability tooling
        run: python3 -m unittest discover -s .github/scripts/tests -p 'test_*.py' -v
  build:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.build == 'true') }}
    name: Build aarch64-apple-darwin
    runs-on: macos-26
    timeout-minutes: 8
    steps:
      - name: Require a successful change selection
        env:
          SELECTION_RESULT: ${{ needs.changes.result }}
        run: test "$SELECTION_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.99.1 and target
        run: |
          rustup toolchain install 1.99.1 --profile minimal --target aarch64-apple-darwin
          rustup default 1.99.1
      # Always built from scratch: a published binary never comes from a cache.
      # The build runs beside validate, off its critical path.
      - name: Build the release executable
        run: cargo build --release --offline --locked --target aarch64-apple-darwin --bin mynou
      - name: Verify the macOS release binary
        run: |
          binary=target/aarch64-apple-darwin/release/mynou
          test -x "$binary"
          file "$binary"
          test "$(lipo -archs "$binary")" = arm64
          otool -hv "$binary"
          otool -L "$binary"
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          test "$("$binary" --version)" = "mynou $version — Rust std, 0 dependencies"
          shasum -a 256 "$binary"
      - name: Start the release binary and reach its API
        if: needs.changes.outputs.release != 'true'
        run: |
          data_root=$(cd "$RUNNER_TEMP" && pwd -P)/mynou-smoke
          python3 - target/aarch64-apple-darwin/release/mynou "$data_root" <<'SMOKE'
          import json, subprocess, sys, time, urllib.error, urllib.request
          from pathlib import Path
          binary, data = sys.argv[1], Path(sys.argv[2])
          service = subprocess.Popen([binary, "serve", "--dir", str(data)])
          def call(method, path, host=None, body=None):
              request = urllib.request.Request(base + path, method=method, data=body)
              if host:
                  request.add_header("Host", host)
              if body is not None:
                  request.add_header("Content-Type", "application/json")
              try:
                  with urllib.request.urlopen(request, timeout=10) as response:
                      return response.status, response.read()
              except urllib.error.HTTPError as error:
                  return error.code, error.read()
          try:
              endpoint = data / "state/endpoint"
              deadline = time.monotonic() + 60
              while not endpoint.exists() or not endpoint.read_text().strip():
                  assert service.poll() is None and time.monotonic() < deadline, "no endpoint"
                  time.sleep(0.2)
              base = "http://" + endpoint.read_text().strip()
              # A new store has the VPN off and gets ready without a choice.
              while call("GET", "/readyz")[0] != 200:
                  assert service.poll() is None and time.monotonic() < deadline, "not ready"
                  time.sleep(0.2)
              assert json.loads(call("GET", "/api/vpn")[1]).get("state") == "disabled"
              status, body = call("GET", "/api/status")
              assert status == 200 and json.loads(body)["version"], body
              status, body = call("GET", "/")
              assert status == 200 and b"<title>" in body, status
              assert call("GET", "/api/status", host="evil.example")[0] == 403
              assert call("POST", "/api/shutdown", body=b"{}")[0] in (200, 202)
              assert service.wait(timeout=60) == 0, "unclean exit"
          finally:
              if service.poll() is None:
                  service.kill()
          SMOKE
      - name: Preserve the executable for packaging
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mynou-native-aarch64-apple-darwin-${{ github.sha }}
          path: target/aarch64-apple-darwin/release/mynou
          if-no-files-found: error
          retention-days: 1
  package:
    needs: [changes, decide, validate, build]
    # Test-only changes need no package; packaging-only changes and releases
    # need no Rust suite.
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.build == 'true' && (needs.validate.result == 'success' || (needs.changes.outputs.tests == 'false' && needs.validate.result == 'skipped')) && needs.build.result == 'success' }}
    # Packaging only copies and checksums the executable; it builds nothing.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ needs.decide.outputs.version }}
      publish: ${{ needs.decide.outputs.publish }}
    steps:
      # A failed decision must fail package, not let it pass on a version that
      # was read before the decision failed.
      - name: Require a successful release decision
        env:
          DECISION_RESULT: ${{ needs.decide.result }}
        run: test "$DECISION_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mynou-native-aarch64-apple-darwin-${{ github.sha }}
          path: ${{ runner.temp }}/mynou-macos-arm64
      - name: Check release script syntax
        run: bash -n .github/scripts/publish-release.sh
      - name: Package the validated release
        env:
          VERSION: ${{ needs.validate.outputs.version || needs.decide.outputs.version }}
          DECIDED_VERSION: ${{ needs.decide.outputs.version }}
        run: |
          test -n "$VERSION"
          test "$VERSION" = "$DECIDED_VERSION"
          mkdir "$RUNNER_TEMP/mynou-release"
          name="mynou-v$VERSION-macos-arm64"
          install -m 755 "$RUNNER_TEMP/mynou-macos-arm64/mynou" "$RUNNER_TEMP/mynou-release/$name"
          test -x "$RUNNER_TEMP/mynou-release/$name"
          cmp "$RUNNER_TEMP/mynou-macos-arm64/mynou" "$RUNNER_TEMP/mynou-release/$name"
          (cd "$RUNNER_TEMP/mynou-release" && sha256sum "$name" > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Preserve validated release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mynou-release-${{ github.sha }}
          path: ${{ runner.temp }}/mynou-release/*
          if-no-files-found: error
          retention-days: 7
  release:
    needs: package
    # Only a pushed version tag that passed the decision publishes; a manual
    # dispatch on a tag never does. The explicit result check is needed: a
    # release skips validate, and the implicit success() would skip this job too.
    if: ${{ !cancelled() && needs.package.result == 'success' && github.event_name == 'push' && github.ref_type == 'tag' && needs.package.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The release key is a secret of this environment, which GitHub opens only
    # to version tags (v*): no branch or pull request can sign.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mynou-release-${{ github.sha }}
          path: ${{ runner.temp }}/mynou-release
      - name: Sign and publish the validated version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MYNOU_RELEASE_KEY: ${{ secrets.MYNOU_RELEASE_KEY }}
          VERSION: ${{ needs.package.outputs.version }}
        run: bash .github/scripts/publish-release.sh "$RUNNER_TEMP/mynou-release" "$VERSION"
