name: Mynou CI
on:
  push:
    # Nothing runs for a commit on trunk: protection requires an up-to-date
    # branch and rebase merging, so trunk holds the tree its pull request
    # validated. Pushing a version tag validates that commit again and publishes.
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mynou-${{ github.workflow }}-${{ github.ref }}
  # A newer PR head supersedes its older validation. Tag runs, which publish a
  # release, are never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  decide:
    # Pull requests, manual dispatches and tags all run the full chain; only a
    # tag that names the Cargo.toml version of a commit already on trunk, and
    # that raised the version over its parent, may then publish. Nothing else
    # depends on this job: package fails on a pull request when its version is
    # missing, and for a tag a failed decision only keeps release from running.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.decision.outputs.publish }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The parent of a tagged commit carries the previous version and the notes.
          fetch-depth: 2
          persist-credentials: false
      - name: Read the package version
        id: version
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'VERSION'
          import tomllib
          with open("Cargo.toml", "rb") as stream:
              print("version=" + tomllib.load(stream)["package"]["version"])
          VERSION
      - name: Decide whether this run validates and publishes a release
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The binary reports the Cargo.toml version, so the tag must name it.
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the Cargo.toml version v$VERSION." >&2
            exit 1
          fi
          # The tag sits on the release commit: it raised the version over its
          # parent, whose unreleased notes become the release notes.
          python3 - "$(git show "$GITHUB_SHA^:Cargo.toml")" "$VERSION" <<'RAISED'
          import sys, tomllib
          before = tomllib.loads(sys.argv[1])["package"]["version"]
          parse = lambda text: tuple(int(part) for part in text.split("."))
          if parse(before) >= parse(sys.argv[2]):
              sys.exit("The tagged commit does not raise the version over its parent.")
          RAISED
          git show "$GITHUB_SHA^:docs/releases/unreleased.md" | python3 engineering/releases.py notes --tag "$GITHUB_REF_NAME" > /dev/null
          # Only a commit that reached trunk through a validated pull request may
          # be released: it must be trunk itself or one of its ancestors.
          relation=$(gh api "repos/$GITHUB_REPOSITORY/compare/trunk...$GITHUB_SHA" --jq .status)
          case "$relation" in
            identical|behind) ;;
            *) echo "Commit $GITHUB_SHA is not on trunk (compare status: $relation)." >&2; exit 1 ;;
          esac
          echo "v$VERSION is a trunk commit; this run publishes it once every check passes." >> "$GITHUB_STEP_SUMMARY"
          echo "publish=true" >> "$GITHUB_OUTPUT"
  validate:
    # Never gated on the decision: a required check that is skipped counts as
    # passed, so only a run that really ended can leave it green.
    # Mynou ships for macOS Apple Silicon only, so its checks run there too.
    runs-on: macos-26
    timeout-minutes: 10
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      # Security audit's source-history job scans every reachable object.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.99.0
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.0
      - name: Restore exact compiled test harnesses
        id: cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            target/debug/deps
            target/debug/examples
            target/debug/mynou
            target/debug/mynou-ci-test-build.jsonl
            target/debug/mynou-ci-test-timings.json
          key: ${{ runner.os }}-${{ runner.arch }}-${{ github.repository }}-rust-1.99-tests-v2-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/**', 'build.rs', 'src/**', 'tests/**', 'examples/**', '.github/workflows/ci.yml') }}
      - name: Verify the dependency graph
        id: metadata
        run: |
          cargo metadata --offline --locked --format-version 1 > "$RUNNER_TEMP/metadata.json"
          python3 - "$RUNNER_TEMP/metadata.json" >> "$GITHUB_OUTPUT" <<'GRAPH'
          import json, sys
          with open(sys.argv[1]) as stream:
              packages = json.load(stream)["packages"]
          assert len(packages) == 1 and packages[0]["name"] == "mynou"
          assert packages[0]["dependencies"] == []
          print("version=" + packages[0]["version"])
          GRAPH
          cargo tree --all-features --target all --edges all --offline --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run Clippy
        run: cargo clippy --all-targets --offline --locked -- -D warnings
      - name: Check the CI test scheduler
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Compile all test harnesses
        if: steps.cache.outputs.cache-hit != 'true'
        run: cargo test --all-targets --no-run --offline --locked --message-format=json-render-diagnostics > target/debug/mynou-ci-test-build.jsonl
      - name: Run all Rust test harnesses in parallel
        run: |
          # macOS keeps its default temporary directory behind a symbolic link,
          # which Mynou refuses, so the tests use the physical runner directory.
          export TMPDIR="$(cd "$RUNNER_TEMP" && pwd -P)"
          python3 .github/scripts/parallel_tests.py target/debug/mynou-ci-test-build.jsonl --metadata "$RUNNER_TEMP/metadata.json" --output "$RUNNER_TEMP/mynou-test-results"
      - name: Preserve test timings and logs
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: mynou-tests-${{ github.sha }}
          path: ${{ runner.temp }}/mynou-test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Save successful compiled test harnesses
        if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/trunk' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            target/debug/deps
            target/debug/examples
            target/debug/mynou
            target/debug/mynou-ci-test-build.jsonl
            target/debug/mynou-ci-test-timings.json
          key: ${{ steps.cache.outputs.cache-primary-key }}
  build:
    name: Build aarch64-apple-darwin
    runs-on: macos-26
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Restore exact release binary
        id: cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            target/aarch64-apple-darwin/release/mynou
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.99-release-v1-aarch64-apple-darwin-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/**', 'build.rs', 'src/**', 'examples/**', '.github/workflows/ci.yml') }}
      - name: Install Rust 1.99.0 and target
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install 1.99.0 --profile minimal --target aarch64-apple-darwin
          rustup default 1.99.0
      - name: Build the release executable
        if: steps.cache.outputs.cache-hit != 'true'
        run: cargo build --release --offline --locked --target aarch64-apple-darwin --bin mynou
      - name: Verify the macOS release binary
        run: |
          binary=target/aarch64-apple-darwin/release/mynou
          test -x "$binary"
          file "$binary"
          test "$(lipo -archs "$binary")" = arm64
          otool -hv "$binary"
          otool -L "$binary"
          shasum -a 256 "$binary"
      - name: Run the standalone demonstration
        run: |
          demo_root=$(cd "$RUNNER_TEMP" && pwd -P)
          target/aarch64-apple-darwin/release/mynou demo --dir "$demo_root/mynou-demo" > "$RUNNER_TEMP/mynou-demo.json"
          cat "$RUNNER_TEMP/mynou-demo.json"
          python3 - "$RUNNER_TEMP/mynou-demo.json" <<'DEMO'
          import json, sys
          with open(sys.argv[1]) as stream:
              result = json.load(stream)
          assert result["job"]["state"] == "ready"
          assert result["plex_scan_confirmed"] is True
          DEMO
      - name: Preserve the executable for packaging
        uses: actions/upload-artifact@v7.0.1
        with:
          name: mynou-native-aarch64-apple-darwin-${{ github.sha }}
          path: target/aarch64-apple-darwin/release/mynou
          if-no-files-found: error
          retention-days: 1
      - name: Save exact release binary
        if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/trunk' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            target/aarch64-apple-darwin/release/mynou
          key: ${{ steps.cache.outputs.cache-primary-key }}
  package:
    needs: [decide, validate, build]
    # Runs after a successful validation and build, even when the decision failed:
    # on a pull request the version check below then fails instead of skipping.
    if: ${{ !cancelled() && needs.validate.result == 'success' && needs.build.result == 'success' }}
    # Packaging only copies and checksums the executable; it builds nothing.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ needs.decide.outputs.version }}
      publish: ${{ needs.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.1
        with:
          name: mynou-native-aarch64-apple-darwin-${{ github.sha }}
          path: ${{ runner.temp }}/mynou-macos-arm64
      - name: Check release script syntax
        run: bash -n .github/scripts/publish-release.sh
      - name: Package the validated release
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          DECIDED_VERSION: ${{ needs.decide.outputs.version }}
        run: |
          test "$VERSION" = "$DECIDED_VERSION"
          mkdir "$RUNNER_TEMP/mynou-release"
          name="mynou-v$VERSION-macos-arm64"
          install -m 755 "$RUNNER_TEMP/mynou-macos-arm64/mynou" "$RUNNER_TEMP/mynou-release/$name"
          test -x "$RUNNER_TEMP/mynou-release/$name"
          cmp "$RUNNER_TEMP/mynou-macos-arm64/mynou" "$RUNNER_TEMP/mynou-release/$name"
          (cd "$RUNNER_TEMP/mynou-release" && sha256sum "$name" > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Preserve validated release files
        uses: actions/upload-artifact@v7.0.1
        with:
          name: mynou-release-${{ github.sha }}
          path: ${{ runner.temp }}/mynou-release/*
          if-no-files-found: error
          retention-days: 7
  release:
    needs: package
    # Only a pushed version tag that passed the decision publishes.
    if: github.ref_type == 'tag' && needs.package.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.1
        with:
          name: mynou-release-${{ github.sha }}
          path: ${{ runner.temp }}/mynou-release
      - name: Publish the validated version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.package.outputs.version }}
        run: bash .github/scripts/publish-release.sh "$RUNNER_TEMP/mynou-release" "$VERSION"
