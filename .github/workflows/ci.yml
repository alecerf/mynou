name: Mynou CI
on:
  push:
    branches: [trunk]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mynou-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Rust 1.99.0
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.0
      - name: Restore exact compiled test harnesses
        id: cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            target/debug/deps
            target/debug/examples
            target/debug/mynou
            target/debug/mynou-ci-test-build.jsonl
            target/debug/mynou-ci-test-timings.json
          key: ${{ runner.os }}-${{ runner.arch }}-${{ github.repository }}-rust-1.99-tests-v2-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/**', 'build.rs', 'src/**', 'tests/**', 'examples/**', 'deploy-compose.yaml', '.github/workflows/ci.yml') }}
      - name: Verify the dependency graph
        id: metadata
        run: |
          cargo metadata --offline --locked --format-version 1 > "$RUNNER_TEMP/metadata.json"
          python3 - "$RUNNER_TEMP/metadata.json" >> "$GITHUB_OUTPUT" <<'GRAPH'
          import json, sys
          with open(sys.argv[1]) as stream:
              packages = json.load(stream)["packages"]
          assert len(packages) == 1 and packages[0]["name"] == "mynou"
          assert packages[0]["dependencies"] == []
          print("version=" + packages[0]["version"])
          GRAPH
          cargo tree --all-features --target all --edges all --offline --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run Clippy
        run: cargo clippy --all-targets --offline --locked -- -D warnings
      - name: Check the CI test scheduler
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Verify engineering policy and serialized recovery scenarios
        run: |
          python3 engineering/policy.py
          python3 -m unittest discover -s engineering/tests -p 'test_*.py' -v
      - name: Compile all test harnesses
        if: steps.cache.outputs.cache-hit != 'true'
        run: cargo test --all-targets --no-run --offline --locked --message-format=json-render-diagnostics > target/debug/mynou-ci-test-build.jsonl
      - name: Run all Rust test harnesses in parallel
        run: python3 .github/scripts/parallel_tests.py target/debug/mynou-ci-test-build.jsonl --metadata "$RUNNER_TEMP/metadata.json" --output "$RUNNER_TEMP/mynou-test-results"
      - name: Preserve test timings and logs
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: mynou-tests-${{ github.sha }}
          path: ${{ runner.temp }}/mynou-test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Save successful compiled test harnesses
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/trunk' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            target/debug/deps
            target/debug/examples
            target/debug/mynou
            target/debug/mynou-ci-test-build.jsonl
            target/debug/mynou-ci-test-timings.json
          key: ${{ steps.cache.outputs.cache-primary-key }}
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, x86_64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Restore exact release binaries
        id: cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            target/${{ matrix.target }}/release/mynou
            target/${{ matrix.target }}/release/examples/package_release
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.99-release-v1-${{ matrix.target }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/**', 'build.rs', 'src/**', 'examples/**', 'deploy-compose.yaml', '.github/workflows/ci.yml') }}
      - name: Install Rust 1.99.0 and target
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install 1.99.0 --profile minimal --target '${{ matrix.target }}'
          rustup default 1.99.0
      - name: Build release deliverables
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [[ "$TARGET" == x86_64-unknown-linux-musl ]]; then
            cargo build --release --offline --locked --target "$TARGET" --bin mynou --example package_release
          else
            cargo build --release --offline --locked --target "$TARGET" --bin mynou
          fi
      - name: Verify the release binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          binary="target/$TARGET/release/mynou"
          test -x "$binary"
          readelf -h "$binary" > "$RUNNER_TEMP/mynou-elf-header.txt"
          readelf -l "$binary" > "$RUNNER_TEMP/mynou-elf-programs.txt"
          readelf -d "$binary" > "$RUNNER_TEMP/mynou-elf-dynamic.txt"
          if [[ "$TARGET" == x86_64-unknown-linux-musl ]]; then
            if grep -q INTERP "$RUNNER_TEMP/mynou-elf-programs.txt" || grep -q NEEDED "$RUNNER_TEMP/mynou-elf-dynamic.txt"; then exit 1; fi
            test -x "target/$TARGET/release/examples/package_release"
          fi
          sha256sum "$binary"
      - name: Run the standalone demonstration
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: target/x86_64-unknown-linux-musl/release/mynou demo --dir "$RUNNER_TEMP/mynou-demo"
      - name: Preserve static deliverables for packaging
        if: matrix.target == 'x86_64-unknown-linux-musl'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: mynou-static-${{ github.sha }}
          path: |
            target/x86_64-unknown-linux-musl/release/mynou
            target/x86_64-unknown-linux-musl/release/examples/package_release
          if-no-files-found: error
          retention-days: 1
      - name: Save exact release binaries
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/trunk' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            target/${{ matrix.target }}/release/mynou
            target/${{ matrix.target }}/release/examples/package_release
          key: ${{ steps.cache.outputs.cache-primary-key }}
  package:
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.1
        with:
          name: mynou-static-${{ github.sha }}
          path: ${{ runner.temp }}/mynou-static
      - name: Prepare checked static deliverables
        run: |
          chmod 755 "$RUNNER_TEMP/mynou-static/mynou" "$RUNNER_TEMP/mynou-static/examples/package_release"
          mkdir .ci-image
          cp "$RUNNER_TEMP/mynou-static/mynou" .ci-image/mynou
      - name: Build and verify the container without recompiling
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          docker build --check .
          docker build --build-arg BINARY_STAGE=prebuilt --tag "mynou:$VERSION" .
          container=$(docker create "mynou:$VERSION")
          docker cp "$container:/mynou" "$RUNNER_TEMP/mynou-image-binary"
          docker rm "$container"
          cmp "$RUNNER_TEMP/mynou-static/mynou" "$RUNNER_TEMP/mynou-image-binary"
          mkdir "$RUNNER_TEMP/mynou-container-demo"
          chmod 777 "$RUNNER_TEMP/mynou-container-demo"
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --mount "type=bind,src=$RUNNER_TEMP/mynou-container-demo,dst=/data" \
            "mynou:$VERSION" demo --dir /data/demo
          docker save "mynou:$VERSION" | gzip -n > "$RUNNER_TEMP/mynou-image.tar.gz"
      - name: Package the validated release
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          "$RUNNER_TEMP/mynou-static/examples/package_release" \
            "$RUNNER_TEMP/mynou-release" "$VERSION" \
            "$RUNNER_TEMP/mynou-static/mynou" "$RUNNER_TEMP/mynou-image.tar.gz" "$GITHUB_WORKSPACE"
          (cd "$RUNNER_TEMP/mynou-release" && sha256sum -c SHA256SUMS)
          python3 - "$RUNNER_TEMP/mynou-release/mynou-v$VERSION-source.zip" <<'ARCHIVE'
          import hashlib, sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as archive:
              assert archive.testzip() is None
              assert (archive.getinfo("mynou/bin/mynou").external_attr >> 16) & 0o777 == 0o755
              for line in archive.read("mynou/SHA256SUMS").decode().splitlines():
                  digest, name = line.split("  ", 1)
                  assert hashlib.sha256(archive.read("mynou/" + name)).hexdigest() == digest
          ARCHIVE
      - name: Preserve validated release files
        uses: actions/upload-artifact@v7.0.1
        with:
          name: mynou-release-${{ github.sha }}
          path: ${{ runner.temp }}/mynou-release/*
          if-no-files-found: error
          retention-days: 7
  release:
    needs: package
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/trunk'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.1
        with:
          name: mynou-release-${{ github.sha }}
          path: ${{ runner.temp }}/mynou-release
      - name: Publish the validated version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.package.outputs.version }}
        run: bash .github/scripts/publish-release.sh "$RUNNER_TEMP/mynou-release" "$VERSION"
