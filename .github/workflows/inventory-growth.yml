name: Inventory growth evidence
on:
  pull_request:
    paths:
      - '.github/workflows/inventory-growth.yml'
      - '.github/scripts/inventory_growth.py'
      - 'src/growth.rs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: inventory-growth-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  measure:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.99.0
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Compile the optimized storage measurement harness
        run: cargo +1.99.0 test --release --lib --no-run --offline --locked --message-format=json > "$RUNNER_TEMP/growth-build.jsonl"
      - name: Measure synthetic inventories on the runner disk
        run: |
          harness=$(python3 - "$RUNNER_TEMP/growth-build.jsonl" <<'PY'
          import json, sys
          for line in open(sys.argv[1]):
              row = json.loads(line)
              if row.get("reason") == "compiler-artifact" and row.get("executable") and row["target"]["kind"] == ["lib"]:
                  print(row["executable"])
          PY
          )
          test -x "$harness"
          python3 .github/scripts/inventory_growth.py "$harness" --output "$RUNNER_TEMP/inventory-growth" | tee "$RUNNER_TEMP/inventory-growth-console.log"
          cat "$RUNNER_TEMP/inventory-growth/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve measurements, environment and raw process logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: inventory-growth-${{ github.sha }}
          path: |
            ${{ runner.temp }}/inventory-growth
            ${{ runner.temp }}/inventory-growth-console.log
            ${{ runner.temp }}/growth-build.jsonl
          if-no-files-found: error
          retention-days: 30
