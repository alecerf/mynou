name: Engineering checks
on:
  push:
    branches: [trunk]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  issues: read
  actions: read
concurrency:
  group: engineering-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  organization:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify policy, Skills and infrastructure source
        run: python3 engineering/policy.py
      - name: Exercise serialized delivery and recovery scenarios
        run: python3 -m unittest discover -s engineering/tests -p 'test_*.py' -v
  agent-qa-review:
    needs: organization
    if: github.event.pull_request && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Require actual current logical QA and security records
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 engineering/control.py qa-gate --pr "$PR_NUMBER" --wait-seconds 600
