name: Repository checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: engineering-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  organization:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify repository and release policy
        run: python3 .github/scripts/policy.py
      - name: Exercise release and security tooling scenarios
        run: python3 -m unittest discover -s .github/scripts/tests -p 'test_*.py' -v
