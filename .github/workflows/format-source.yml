name: Format source branches
on:
  push:
    branches: ['format/**']
permissions:
  contents: write
concurrency:
  group: mynou-format-${{ github.ref }}
  cancel-in-progress: true
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install the current Rust formatter
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt
      - name: Format source
        run: cargo +1.99.0 fmt --all
      - name: Commit formatting edits
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.rs'
          git commit -m 'Format Rust source with the current CI toolchain'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
