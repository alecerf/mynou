version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels: ['agent-work', 'origin:maintenance', 'priority:p2', 'risk:high', 'role:quality', 'status:needs-triage']
    groups:
      actions:
        patterns: ['*']
