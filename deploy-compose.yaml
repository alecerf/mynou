services:
  mynou:
    image: mynou:0.20.6
    restart: unless-stopped
    user: "${MYNOU_UID:-1000}:${MYNOU_GID:-1000}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file: .env
    ports:
      - "127.0.0.1:8787:8787"
      - "6881:6881/tcp"
    volumes:
      - ./mynou.json:/config/mynou.json:ro
      - ./data:/data
      - ./library:/library
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: [serve, --config, /config/mynou.json]
    healthcheck:
      test: [CMD, /mynou, healthcheck, --config, /config/mynou.json]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
