services:
  mynou:
    image: mynou:0.9.0
    build:
      context: .
    user: "${MYNOU_UID:-1000}:${MYNOU_GID:-1000}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8787:8787/tcp"
      - "6881:6881/tcp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config/docker.json:/config/mynou.json:ro
      - ./data:/data
      - ./library:/library
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,uid=1000,gid=1000,mode=0700
    stop_grace_period: 30s
